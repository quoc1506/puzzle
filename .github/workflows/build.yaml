name: Multiplatform Binary Build

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'build.cpp'
      - '.github/workflows/**'
      - 'build.yaml'
      - 'build.yml'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux (Ubuntu 24.04 x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libsecp256k1-dev libssl-dev libcurl4-openssl-dev zlib1g-dev

      - name: Compile portable binary (statically link libsecp256k1)
        run: |
          mkdir -p bin
          SECP_A=$(find /usr -name "libsecp256k1.a" 2>/dev/null | head -n 1)

          if [ -n "$SECP_A" ]; then
            g++ -std=c++17 -O3 -march=x86-64-v3 -mavx2 -mbmi2 -madx -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -pthread build.cpp "$SECP_A"               -static-libgcc -static-libstdc++               -lssl -lcrypto -lcurl -lpthread -ldl               -o bin/build-linux-x86_64

            g++ -std=c++17 -O3 -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -pthread build.cpp "$SECP_A"               -static-libgcc -static-libstdc++               -lssl -lcrypto -lcurl -lpthread -ldl               -o bin/build-linux-x86_64-compat
          else
            g++ -std=c++17 -O3 -march=x86-64-v3 -mavx2 -mbmi2 -madx -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -pthread build.cpp               -static-libgcc -static-libstdc++               -Wl,-Bstatic -lsecp256k1 -Wl,-Bdynamic               -lssl -lcrypto -lcurl -lpthread -ldl               -o bin/build-linux-x86_64

            g++ -std=c++17 -O3 -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -pthread build.cpp               -static-libgcc -static-libstdc++               -Wl,-Bstatic -lsecp256k1 -Wl,-Bdynamic               -lssl -lcrypto -lcurl -lpthread -ldl               -o bin/build-linux-x86_64-compat
          fi

          strip bin/build-linux-x86_64*
          chmod +x bin/build-linux-x86_64*

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-x86_64
          path: bin/build-linux-x86_64*

  build-linux-u22:
    name: Build Linux (Ubuntu 22.04 x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential libsecp256k1-dev libssl-dev libcurl4-openssl-dev zlib1g-dev

      - name: Compile portable binary (statically link libsecp256k1)
        run: |
          mkdir -p bin
          SECP_A=$(find /usr -name "libsecp256k1.a" 2>/dev/null | head -n 1)

          if [ -n "$SECP_A" ]; then
            g++ -std=c++17 -O3 -march=x86-64-v3 -mavx2 -mbmi2 -madx -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -pthread build.cpp "$SECP_A" \
              -static-libgcc -static-libstdc++ \
              -lssl -lcrypto -lcurl -lpthread -ldl \
              -o bin/build-linux-u22-x86_64

            g++ -std=c++17 -O3 -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -pthread build.cpp "$SECP_A" \
              -static-libgcc -static-libstdc++ \
              -lssl -lcrypto -lcurl -lpthread -ldl \
              -o bin/build-linux-u22-x86_64-compat
          else
            g++ -std=c++17 -O3 -march=x86-64-v3 -mavx2 -mbmi2 -madx -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -pthread build.cpp \
              -static-libgcc -static-libstdc++ \
              -Wl,-Bstatic -lsecp256k1 -Wl,-Bdynamic \
              -lssl -lcrypto -lcurl -lpthread -ldl \
              -o bin/build-linux-u22-x86_64

            g++ -std=c++17 -O3 -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -pthread build.cpp \
              -static-libgcc -static-libstdc++ \
              -Wl,-Bstatic -lsecp256k1 -Wl,-Bdynamic \
              -lssl -lcrypto -lcurl -lpthread -ldl \
              -o bin/build-linux-u22-x86_64-compat
          fi

          strip bin/build-linux-u22-x86_64*
          chmod +x bin/build-linux-u22-x86_64*

      - name: Upload Linux Ubuntu 22.04 artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-u22-x86_64
          path: bin/build-linux-u22-x86_64*

  build-macos:
    name: Build macOS (ARM64 & x86_64 Cross-Compile)
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install ARM64 dependencies via Homebrew
        run: |
          brew install secp256k1 openssl@3 curl

      - name: Compile Apple Silicon (arm64) binary
        run: |
          mkdir -p bin
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          CURL_PREFIX=$(brew --prefix curl)
          SECP_PREFIX=$(brew --prefix secp256k1)

          clang++ -std=c++17 -O3 -mcpu=apple-m1 -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto build.cpp             -I${SECP_PREFIX}/include             -I${OPENSSL_PREFIX}/include             -I${CURL_PREFIX}/include             -L${SECP_PREFIX}/lib             -L${OPENSSL_PREFIX}/lib             -L${CURL_PREFIX}/lib             -lsecp256k1 -lssl -lcrypto -lcurl             -o bin/build-macos-arm64
          chmod +x bin/build-macos-arm64

      - name: Build Intel (x86_64) static libraries & compile
        run: |
          mkdir -p x86_build && cd x86_build

          curl -sSL https://www.openssl.org/source/openssl-3.0.15.tar.gz | tar -xz
          cd openssl-3.0.15
          ./Configure darwin64-x86_64-cc no-shared no-tests -mmacosx-version-min=10.15 --prefix=$(pwd)/dist
          make -j$(sysctl -n hw.ncpu) >/dev/null 2>&1
          make install_sw >/dev/null 2>&1
          OPENSSL_X86=$(pwd)/dist
          cd ..

          git clone --depth 1 https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1
          cmake -B build -G "Unix Makefiles"             -DCMAKE_SYSTEM_NAME=Darwin             -DCMAKE_OSX_ARCHITECTURES=x86_64             -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX=$(pwd)/dist             -DBUILD_SHARED_LIBS=OFF             -DSECP256K1_ENABLE_MODULE_RECOVERY=ON             -DSECP256K1_BUILD_TESTS=OFF             -DSECP256K1_BUILD_BENCHMARK=OFF
          cmake --build build -j$(sysctl -n hw.ncpu) >/dev/null 2>&1
          cmake --install build >/dev/null 2>&1
          SECP_X86=$(pwd)/dist
          cd ..

          curl -sSL https://curl.se/download/curl-8.9.1.tar.gz | tar -xz
          cd curl-8.9.1
          ./configure --host=x86_64-apple-darwin             --prefix=$(pwd)/dist             --disable-shared --enable-static             --with-openssl=${OPENSSL_X86}             --disable-ldap --disable-ldaps             CFLAGS="-target x86_64-apple-macos10.15 -mmacosx-version-min=10.15"
          make -j$(sysctl -n hw.ncpu) >/dev/null 2>&1
          make install >/dev/null 2>&1
          CURL_X86=$(pwd)/dist
          cd ..
          cd ..

          SSL_LIB_DIR="${OPENSSL_X86}/lib"
          if [ -d "${OPENSSL_X86}/lib64" ]; then
            SSL_LIB_DIR="${OPENSSL_X86}/lib64"
          fi

          clang++ -std=c++17 -O3 -march=x86-64-v3 -mavx2 -mbmi2 -madx -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -target x86_64-apple-macos10.15 -mmacosx-version-min=10.15             -DCURL_STATICLIB -DSECP256K1_STATIC             build.cpp             -I${SECP_X86}/include             -I${OPENSSL_X86}/include             -I${CURL_X86}/include             ${SECP_X86}/lib/libsecp256k1.a             ${CURL_X86}/lib/libcurl.a             ${SSL_LIB_DIR}/libssl.a             ${SSL_LIB_DIR}/libcrypto.a             -framework CoreFoundation -framework SystemConfiguration             -lz -lpthread             -o bin/build-macos-x86_64

          chmod +x bin/build-macos-x86_64
          rm -rf x86_build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-macos
          path: bin/build-macos-*

  build-windows:
    name: Build Windows (x86_64 Static)
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSYS2 environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-pkg-config

      - name: Build and install libsecp256k1 static via CMake
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/bitcoin-core/secp256k1.git
          cd secp256k1
          cmake -B build -G "Ninja"             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_INSTALL_PREFIX=/mingw64             -DBUILD_SHARED_LIBS=OFF             -DSECP256K1_ENABLE_MODULE_RECOVERY=ON             -DSECP256K1_BUILD_TESTS=OFF             -DSECP256K1_BUILD_BENCHMARK=OFF
          cmake --build build
          cmake --install build
          cd ..
          rm -rf secp256k1

      - name: Compile Windows static binary
        shell: msys2 {0}
        run: |
          mkdir -p bin
          CURL_STATIC_LIBS=$(pkg-config --static --libs libcurl)
          g++ -std=c++17 -O3 -march=x86-64-v3 -mavx2 -mbmi2 -madx -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto             -DCURL_STATICLIB -DSECP256K1_STATIC             build.cpp             -static -static-libgcc -static-libstdc++             -lsecp256k1 $CURL_STATIC_LIBS -lws2_32 -lcrypt32 -lwldap32             -o bin/build-windows-x86_64.exe

          g++ -std=c++17 -O3 -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto             -DCURL_STATICLIB -DSECP256K1_STATIC             build.cpp             -static -static-libgcc -static-libstdc++             -lsecp256k1 $CURL_STATIC_LIBS -lws2_32 -lcrypt32 -lwldap32             -o bin/build-windows-x86_64-compat.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows-x86_64
          path: bin/build-windows-x86_64*.exe

  publish-bin-folder:
    name: Consolidate Binaries into bin/
    needs: [build-linux, build-linux-u22, build-macos, build-windows]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin-download/

      - name: Organize bin directory
        run: |
          mkdir -p bin
          find bin-download -type f -name "*build*" -exec cp {} bin/ ';'
          chmod +x bin/build-linux-* 2>/dev/null || true
          chmod +x bin/build-macos-* 2>/dev/null || true

      - name: Commit and push binaries to bin/
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-build multiplatform binaries in bin/ [skip ci]"
            git push
          fi
