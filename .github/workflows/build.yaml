name: Multiplatform Binary Build

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'build.cpp'
      - 'build_cuda.cu'
      - '.github/workflows/**'
      - 'build.yaml'
      - 'build.yml'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-cuda:
    name: Build CUDA GPU Worker (Ubuntu x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install CUDA Toolkit & Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nvidia-cuda-toolkit libcurl4-openssl-dev libssl-dev

      - name: Compile CUDA Solver Binary
        run: |
          mkdir -p bin
          echo "=== Detecting supported GPU architectures for installed nvcc ==="
          nvcc --version

          GENCODES=""
          LAST_ARCH=""
          for arch in 60 61 70 75 80 86 89 90; do
            if nvcc -gencode arch=compute_${arch},code=sm_${arch} -E -x cu /dev/null -o /dev/null 2>/dev/null; then
              GENCODES="${GENCODES} -gencode arch=compute_${arch},code=sm_${arch}"
              LAST_ARCH=${arch}
            fi
          done

          if [ -n "${LAST_ARCH}" ]; then
            GENCODES="${GENCODES} -gencode arch=compute_${LAST_ARCH},code=compute_${LAST_ARCH}"
          fi

          echo "Selected NVCC architecture flags: ${GENCODES}"

          nvcc -O3 -std=c++17 ${GENCODES} \
            -x cu build.cpp -o bin/build_cuda -lcurl -lssl -lcrypto
          strip bin/build_cuda
          chmod +x bin/build_cuda

      - name: Upload CUDA artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-cuda-x86_64
          path: bin/build_cuda

  build-linux:
    name: Build Linux (Ubuntu 24.04 x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake git libssl-dev zlib1g-dev

      - name: Build static libcurl
        run: |
          mkdir -p /tmp/curl_build && cd /tmp/curl_build
          git clone --depth 1 -b curl-8_6_0 https://github.com/curl/curl.git
          cd curl
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/dist \
            -DBUILD_SHARED_LIBS=OFF \
            -DCURL_STATICLIB=ON \
            -DHTTP_ONLY=ON \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build -j$(nproc) >/dev/null 2>&1
          cmake --install build >/dev/null 2>&1

      - name: Compile portable binary (statically link libcurl, libssl, libcrypto)
        run: |
          mkdir -p bin
          CURL_A=$(find /tmp/curl_build/curl/dist -name "libcurl.a" 2>/dev/null | head -n 1)
          SSL_A=$(find /usr -name "libssl.a" 2>/dev/null | head -n 1)
          CRYPTO_A=$(find /usr -name "libcrypto.a" 2>/dev/null | head -n 1)
          CURL_INC="/tmp/curl_build/curl/dist/include"

          g++ -std=c++17 -O3 -march=x86-64-v3 -mavx2 -mbmi2 -madx -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -pthread \
            -DCURL_STATICLIB -I${CURL_INC} build.cpp \
            ${CURL_A} ${SSL_A} ${CRYPTO_A} \
            -static-libgcc -static-libstdc++ \
            -Wl,-Bstatic -lz -Wl,-Bdynamic \
            -lpthread -ldl \
            -o bin/build-linux-x86_64

          g++ -std=c++17 -O3 -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -pthread \
            -DCURL_STATICLIB -I${CURL_INC} build.cpp \
            ${CURL_A} ${SSL_A} ${CRYPTO_A} \
            -static-libgcc -static-libstdc++ \
            -Wl,-Bstatic -lz -Wl,-Bdynamic \
            -lpthread -ldl \
            -o bin/build-linux-x86_64-compat

          strip bin/build-linux-x86_64*
          chmod +x bin/build-linux-x86_64*

          echo "=== Check dynamic dependencies for build-linux-x86_64 ==="
          ldd bin/build-linux-x86_64 || true
          if ldd bin/build-linux-x86_64 2>&1 | grep -E "(libssl\.so|libcrypto\.so|libcurl\.so)"; then
            echo "FATAL: dynamic SSL/Crypto/Curl detected!"
            exit 1
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-x86_64
          path: bin/build-linux-x86_64*

  build-linux-u22:
    name: Build Linux (Ubuntu 22.04 x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential cmake git libssl-dev zlib1g-dev

      - name: Build static libcurl
        run: |
          mkdir -p /tmp/curl_build && cd /tmp/curl_build
          git clone --depth 1 -b curl-8_6_0 https://github.com/curl/curl.git
          cd curl
          cmake -B build -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$(pwd)/dist \
            -DBUILD_SHARED_LIBS=OFF \
            -DCURL_STATICLIB=ON \
            -DHTTP_ONLY=ON \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build -j$(nproc) >/dev/null 2>&1
          cmake --install build >/dev/null 2>&1

      - name: Compile portable binary (statically link libcurl, libssl, libcrypto)
        run: |
          mkdir -p bin
          CURL_A=$(find /tmp/curl_build/curl/dist -name "libcurl.a" 2>/dev/null | head -n 1)
          SSL_A=$(find /usr -name "libssl.a" 2>/dev/null | head -n 1)
          CRYPTO_A=$(find /usr -name "libcrypto.a" 2>/dev/null | head -n 1)
          CURL_INC="/tmp/curl_build/curl/dist/include"

          g++ -std=c++17 -O3 -march=x86-64-v3 -mavx2 -mbmi2 -madx -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -pthread \
            -DCURL_STATICLIB -I${CURL_INC} build.cpp \
            ${CURL_A} ${SSL_A} ${CRYPTO_A} \
            -static-libgcc -static-libstdc++ \
            -Wl,-Bstatic -lz -Wl,-Bdynamic \
            -lpthread -ldl \
            -o bin/build-linux-u22-x86_64

          g++ -std=c++17 -O3 -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -pthread \
            -DCURL_STATICLIB -I${CURL_INC} build.cpp \
            ${CURL_A} ${SSL_A} ${CRYPTO_A} \
            -static-libgcc -static-libstdc++ \
            -Wl,-Bstatic -lz -Wl,-Bdynamic \
            -lpthread -ldl \
            -o bin/build-linux-u22-x86_64-compat

          strip bin/build-linux-u22-x86_64*
          chmod +x bin/build-linux-u22-x86_64*

          echo "=== Check dynamic dependencies for build-linux-u22-x86_64 ==="
          ldd bin/build-linux-u22-x86_64 || true
          if ldd bin/build-linux-u22-x86_64 2>&1 | grep -E "(libssl\.so|libcrypto\.so|libcurl\.so)"; then
            echo "FATAL: dynamic SSL/Crypto/Curl detected!"
            exit 1
          fi

      - name: Upload Linux Ubuntu 22.04 artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-u22-x86_64
          path: bin/build-linux-u22-x86_64*

  build-linux-musl:
    name: Build Linux Static (Musl / Alpine - Universal Compatibility)
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install build tools and static libraries
        run: |
          apk update
          apk add --no-cache build-base cmake git openssl-dev openssl-libs-static zlib-dev zlib-static linux-headers

      - name: Build static libcurl with OpenSSL
        run: |
          mkdir -p /tmp/curl_build && cd /tmp/curl_build
          git clone --depth 1 -b curl-8_8_0 https://github.com/curl/curl.git
          cd curl
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=OFF \
            -DCURL_STATICLIB=ON \
            -DHTTP_ONLY=ON \
            -DCURL_USE_OPENSSL=ON \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DBUILD_CURL_EXE=OFF \
            -DBUILD_TESTING=OFF
          cmake --build build -j$(nproc) >/dev/null 2>&1
          cmake --install build >/dev/null 2>&1

      - name: Compile 100% static universal binaries (Zero GLIBC dependency)
        run: |
          mkdir -p bin

          # AVX2 optimized static binary
          g++ -static -std=c++17 -O3 -march=x86-64-v3 -mavx2 -mbmi2 -madx -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto \
            -DCURL_STATICLIB build.cpp \
            -I/usr/local/include -L/usr/local/lib \
            -lcurl -lssl -lcrypto -lz -lpthread \
            -o bin/build-linux-musl-x86_64

          # Universal compatibility static binary (runs on ALL Linux x86_64 distros, old & new, zero glibc dependency)
          g++ -static -std=c++17 -O3 -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto \
            -DCURL_STATICLIB build.cpp \
            -I/usr/local/include -L/usr/local/lib \
            -lcurl -lssl -lcrypto -lz -lpthread \
            -o bin/build-linux-musl-x86_64-compat

          # Copy as default universal fallback binary
          cp bin/build-linux-musl-x86_64-compat bin/build

          strip bin/build-linux-musl-* bin/build
          chmod +x bin/build-linux-musl-* bin/build

          echo "=== Check static executable properties ==="
          file bin/build-linux-musl-x86_64
          file bin/build-linux-musl-x86_64-compat
          file bin/build

      - name: Upload Linux Musl artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-musl-x86_64
          path: |
            bin/build-linux-musl-*
            bin/build

  build-linux-riscv64:
    name: Build Linux (RISC-V 64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build RISC-V 64 binary via QEMU
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: riscv64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -y
            apt-get install -y build-essential libssl-dev libcurl4-openssl-dev zlib1g-dev
          run: |
            mkdir -p bin
            SSL_A=$(find /usr -name "libssl.a" 2>/dev/null | head -n 1)
            CRYPTO_A=$(find /usr -name "libcrypto.a" 2>/dev/null | head -n 1)

            STATIC_LIBS=""
            [ -n "$SSL_A" ] && STATIC_LIBS="${STATIC_LIBS} ${SSL_A}"
            [ -n "$CRYPTO_A" ] && STATIC_LIBS="${STATIC_LIBS} ${CRYPTO_A}"

            FALLBACK_FLAGS=""
            [ -z "$SSL_A" ] && FALLBACK_FLAGS="${FALLBACK_FLAGS} -lssl"
            [ -z "$CRYPTO_A" ] && FALLBACK_FLAGS="${FALLBACK_FLAGS} -lcrypto"

            g++ -std=c++17 -O3 -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -pthread build.cpp \
              ${STATIC_LIBS} ${FALLBACK_FLAGS} \
              -static-libgcc -static-libstdc++ \
              -lcurl -lz -lpthread -ldl \
              -o bin/build-linux-riscv64
            strip bin/build-linux-riscv64
            chmod +x bin/build-linux-riscv64

      - name: Upload Linux RISC-V artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-riscv64
          path: bin/build-linux-riscv64

  build-macos:
    name: Build macOS (ARM64 & x86_64 Cross-Compile)
    runs-on: macos-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install dependencies via Homebrew
        run: |
          brew install openssl@3 curl

      - name: Build Apple Silicon (arm64) static binary
        run: |
          mkdir -p bin
          OPENSSL_PREFIX=$(brew --prefix openssl@3)

          SSL_LIB_DIR="${OPENSSL_PREFIX}/lib"
          if [ -d "${OPENSSL_PREFIX}/lib64" ]; then
            SSL_LIB_DIR="${OPENSSL_PREFIX}/lib64"
          fi

          clang++ -std=c++17 -O3 -mcpu=apple-m1 -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto \
            -target arm64-apple-macos11.0 -mmacosx-version-min=11.0 \
            build.cpp \
            -I${OPENSSL_PREFIX}/include \
            ${SSL_LIB_DIR}/libssl.a \
            ${SSL_LIB_DIR}/libcrypto.a \
            -lcurl -lz -lpthread \
            -framework CoreFoundation -framework SystemConfiguration -framework Security \
            -o bin/build-macos-arm64

          chmod +x bin/build-macos-arm64

      - name: Build Intel (x86_64) static libraries & compile
        run: |
          mkdir -p x86_build && cd x86_build

          curl -sSL https://www.openssl.org/source/openssl-3.0.15.tar.gz | tar -xz
          cd openssl-3.0.15
          ./Configure darwin64-x86_64-cc no-shared no-tests -mmacosx-version-min=10.15 --prefix=$(pwd)/dist
          make -j$(sysctl -n hw.ncpu) >/dev/null 2>&1
          make install_sw >/dev/null 2>&1
          OPENSSL_X86=$(pwd)/dist
          cd ..

          curl -sSL https://curl.se/download/curl-8.9.1.tar.gz | tar -xz
          cd curl-8.9.1
          ./configure --host=x86_64-apple-darwin \
            --prefix=$(pwd)/dist \
            --disable-shared --enable-static \
            --with-openssl=${OPENSSL_X86} \
            --disable-ldap --disable-ldaps \
            CFLAGS="-target x86_64-apple-macos10.15 -mmacosx-version-min=10.15"
          make -j$(sysctl -n hw.ncpu) >/dev/null 2>&1
          make install >/dev/null 2>&1
          CURL_X86=$(pwd)/dist
          cd ..
          cd ..

          SSL_LIB_DIR="${OPENSSL_X86}/lib"
          if [ -d "${OPENSSL_X86}/lib64" ]; then
            SSL_LIB_DIR="${OPENSSL_X86}/lib64"
          fi

          clang++ -std=c++17 -O3 -march=x86-64-v3 -mavx2 -mbmi2 -madx -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto -target x86_64-apple-macos10.15 -mmacosx-version-min=10.15 \
            -DCURL_STATICLIB \
            build.cpp \
            -I${OPENSSL_X86}/include \
            -I${CURL_X86}/include \
            ${CURL_X86}/lib/libcurl.a \
            ${SSL_LIB_DIR}/libssl.a \
            ${SSL_LIB_DIR}/libcrypto.a \
            -framework CoreFoundation -framework SystemConfiguration \
            -lz -lpthread \
            -o bin/build-macos-x86_64

          chmod +x bin/build-macos-x86_64
          rm -rf x86_build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bin-macos
          path: bin/build-macos-*

  build-windows:
    name: Build Windows (x86_64 Static)
    runs-on: windows-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup MSYS2 environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-pkg-config

      - name: Compile Windows static binary
        shell: msys2 {0}
        run: |
          mkdir -p bin
          CURL_STATIC_LIBS=$(pkg-config --static --libs libcurl)
          g++ -std=c++17 -O3 -march=x86-64-v3 -mavx2 -mbmi2 -madx -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto \
            -DCURL_STATICLIB \
            build.cpp \
            -static -static-libgcc -static-libstdc++ \
            $CURL_STATIC_LIBS -lws2_32 -lcrypt32 -lwldap32 \
            -o bin/build-windows-x86_64.exe

          g++ -std=c++17 -O3 -funroll-loops -fomit-frame-pointer -finline-functions -fno-stack-protector -pipe -flto \
            -DCURL_STATICLIB \
            build.cpp \
            -static -static-libgcc -static-libstdc++ \
            $CURL_STATIC_LIBS -lws2_32 -lcrypt32 -lwldap32 \
            -o bin/build-windows-x86_64-compat.exe

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-windows-x86_64
          path: bin/build-windows-x86_64*.exe

  publish-bin-folder:
    name: Consolidate Binaries into bin/
    needs: [build-cuda, build-linux, build-linux-u22, build-linux-musl, build-linux-riscv64, build-macos, build-windows]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin-download/

      - name: Organize bin directory
        run: |
          mkdir -p bin
          find bin-download -type f -name "*build*" -exec cp {} bin/ ';'
          chmod +x bin/build-linux-* bin/build bin/build_cuda 2>/dev/null || true
          chmod +x bin/build-macos-* 2>/dev/null || true

      - name: Commit and push binaries to bin/
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-build multiplatform binaries in bin/ [skip ci]"
            git push
          fi
